<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamados</title>
</head>
<body>
    <h1>Chamados cadastrados</h1>
    <p><a href="/chamados/novo">Abrir novo chamado</a></p>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="chamado : ${chamados}">
                <td th:text="${chamado.id}"></td>
                <td th:text="${chamado.titulo}"></td>
                <td th:text="${chamado.status}"></td>
            </tr>
        </tbody>
    </table>
</body>
